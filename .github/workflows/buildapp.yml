
# Original idea by @ISnackable. Many thanks to him for handling the most hardest parts!
# https://github.com/ISnackable/YTCubePlus/blob/main/.github/workflows/Build.yml

name: Build and Release YouTubeRebornPlus

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: "iOS SDK version to be used during build"
        default: "17.5"
        required: true
        type: string
      reborn_version:
        description: "The version of YouTube Reborn"
        default: "4.2.9"
        required: true
        type: string
      decrypted_youtube_url:
        description: "The direct URL to the decrypted YouTube ipa"
        default: ""
        required: true
        type: string
      bundle_id:
        description: "Modify the bundle ID. Not recommended"
        default: "com.google.ios.youtube"
        required: true
        type: string
      app_name:
        description: "Modify the name of the app on the Home Screen. Not recommended"
        default: "YouTube"
        required: true
        type: string
      create_release:
        description: "Create a draft release"
        default: true
        required: false
        type: boolean
      upload_artifact:
        description: "Upload Artifact"
        default: true
        required: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build YouTubeRebornPlus
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout Main
        uses: actions/checkout@v5
        with:
          path: main
          submodules: recursive

      - name: Patch YouPiP compile errors
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings = Path("main/Tweaks/YouPiP/Settings.x")
          legacy = Path("main/Tweaks/YouPiP/LegacyPiPCompat.x")

          if not settings.is_file():
              raise SystemExit(f"Settings.x not found: {settings}")
          if not legacy.is_file():
              raise SystemExit(f"LegacyPiPCompat.x not found: {legacy}")

          s = settings.read_text()
          old = "NSMutableArray *mutableCategories = %orig.mutableCopy;"
          new = (
              "NSArray *categories = %orig;\n"
              "    NSMutableArray *mutableCategories = categories.mutableCopy;"
          )

          if old in s:
              s = s.replace(old, new, 1)
              settings.write_text(s)
              print("Patched Settings.x")
          elif "NSArray *categories = %orig;" in s:
              print("Settings.x already contains the fix")
          else:
              raise SystemExit("Settings.x did not match the expected source version")

          s = legacy.read_text()
          replacements = [
              (
                  "return initPlayerPIPControllerIfNeeded(%orig, delegate, nil);",
                  "YTPlayerPIPController *controller = %orig;\n"
                  "    return initPlayerPIPControllerIfNeeded(controller, delegate, nil);",
              ),
              (
                  "return initPlayerPIPControllerIfNeeded(%orig, delegate, parentResponder);",
                  "YTPlayerPIPController *controller = %orig;\n"
                  "    return initPlayerPIPControllerIfNeeded(controller, delegate, parentResponder);",
              ),
          ]

          changed = 0
          for old, new in replacements:
              if old in s:
                  s = s.replace(old, new, 1)
                  changed += 1

          if changed == 2:
              legacy.write_text(s)
              print("Patched both LegacyPiPCompat.x methods")
          elif changed == 0 and "initPlayerPIPControllerIfNeeded" not in s:
              raise SystemExit(
                  "LegacyPiPCompat.x is a different version from the one "
                  "in the original build errors. No patch was applied."
              )
          elif changed == 0:
              print("LegacyPiPCompat.x may already be patched; checking build output will confirm.")
          else:
              raise SystemExit(
                  "Only one expected LegacyPiPCompat.x method was found. "
                  "Stopped to avoid a partial patch."
              )
          PY

      - name: Install Dependencies
        run: brew install ldid dpkg make

      - name: Set PATH environment variable
        run: echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

      - name: Setup Theos
        uses: actions/checkout@v5
        with:
          repository: theos/theos
          ref: master
          path: theos
          submodules: recursive

      - name: SDK Caching
        id: SDK
        uses: actions/cache@v4.3.0
        env:
          cache-name: iOS-${{ inputs.sdk_version }}-SDK
        with:
          path: theos/sdks/
          key: ${{ env.cache-name }}
          restore-keys: ${{ env.cache-name }}

      - name: Download iOS SDK
        if: steps.SDK.outputs.cache-hit != 'true'
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/aricloverALT/sdks/
          cd sdks
          git sparse-checkout set --no-cone iPhoneOS${{ inputs.sdk_version }}.sdk
          git checkout
          mv *.sdk $THEOS/sdks
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Setup Theos Jailed
        uses: actions/checkout@v5
        with:
          repository: qnblackcat/theos-jailed
          ref: master
          path: theos-jailed
          submodules: recursive

      - name: Install Theos Jailed
        run: |
          ./theos-jailed/install
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Prepare YouTube iPA
        id: prepare_youtube
        run: |
          wget "$YOUTUBE_URL" --no-verbose -O main/YouTube.ipa
          cd "${{ github.workspace }}/main"
          mv YouTube.ipa YouTube.zip
          unzip -q YouTube.zip
          youtube_version=$(defaults read "$(pwd)/Payload/YouTube.app/Info" CFBundleVersion)
          echo "==> YouTube v$youtube_version downloaded!"
          sed -i '' "17s#.*#YOUTUBE_VERSION = ${youtube_version}#g" Makefile
          echo "youtube_version=${youtube_version}" >> "$GITHUB_OUTPUT"
        env:
          THEOS: ${{ github.workspace }}/theos
          YOUTUBE_URL: ${{ inputs.decrypted_youtube_url }}

      - name: Build Package
        id: build_package
        run: |
          cd "${{ github.workspace }}/main"
          sed -i '' "27s#.*#BUNDLE_ID = ${{ inputs.bundle_id }}#g" Makefile
          sed -i '' "26s#.*#DISPLAY_NAME = ${{ inputs.app_name }}#g" Makefile
          sed -i '' "1s#.*#export TARGET = iphone:clang:${{ inputs.sdk_version }}:14.0#g" Makefile
          make package THEOS_PACKAGE_SCHEME=rootless IPA=Payload/YouTube.app FINALPACKAGE=1
          echo "package=$(ls -t packages | head -n1)" >> "$GITHUB_OUTPUT"
          echo "SHASUM256: $(shasum -a 256 packages/*.ipa | cut -f1 -d' ')"
          echo "Bundle ID: ${{ inputs.bundle_id }}"
        env:
          THEOS: ${{ github.workspace }}/theos
          REBORN_VERSION: ${{ inputs.reborn_version }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          APP_NAME: ${{ inputs.app_name }}

      - name: Upload Artifact
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v4.6.2
        env:
          REBORN_VERSION: ${{ inputs.reborn_version }}
          YOUTUBE_VERSION: ${{ steps.prepare_youtube.outputs.youtube_version }}
        with:
          name: YouTubeRebornPlus_${{ env.YOUTUBE_VERSION }}_${{ env.REBORN_VERSION }}
          path: ${{ github.workspace }}/main/packages/${{ steps.build_package.outputs.package }}
          if-no-files-found: error

      - name: Create Release
        if: ${{ inputs.create_release }}
        id: create_release
        uses: softprops/action-gh-release@v2.4.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REBORN_VERSION: ${{ inputs.reborn_version }}
          YOUTUBE_VERSION: ${{ steps.prepare_youtube.outputs.youtube_version }}
          DRAFT: ${{ inputs.create_release }}
        with:
          tag_name: v${{ env.YOUTUBE_VERSION }}-${{ env.REBORN_VERSION }}-(${{ github.run_number }})
          name: v${{ env.YOUTUBE_VERSION }}-${{ env.REBORN_VERSION }}-(${{ github.run_number }})
          files: main/packages/*.ipa
          draft: ${{ env.DRAFT }}
